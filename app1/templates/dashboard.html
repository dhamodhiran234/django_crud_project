<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        {% load static %}
    <link rel="icon" href="{% static 'back.webp' %}" type="image/x-icon">
    <style>
        /* *{
            background-image: url("static/backg.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        } */
         *{
            margin: 0%;
        
            padding: 0%;
         }
        
         .item1{
            display: flex;
            background-color: cadetblue;
            color: black;
            padding: 20px;
            margin: 20px;
            border-radius: 20px;
            border: 4px solid rgb(225, 37, 137);
         }
        .item1 h1{
            text-align: center;
            width: 100%;
        }
        li{
            display: inline;
            margin-left: 7px;
            font-size: large;
            color: rgb(51, 55, 52); 
           
        }
        ol{
            padding: 5px;
             width: 30%;
        }
        .item2{
            display: flex;
            justify-content: space-around;
            width: 100%;
            flex-wrap: wrap;
        }
        .child1{
            width: 40%;           
            padding: 10px;
            background-color: black;
            margin-left: 30px;
            margin-right: 30px;
             border-radius: 20px;
             border: 4px solid blue;
        }
        .child1 img{
            width: 70%;
            height: 50%;
        }
        .child1 .image,.btn{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .child1 h1{
            text-align: center;
            color: white;
            margin: 10PX;
        }
        .child1 .btn button{
            padding: 10px;
            width: 50%;
            margin: 20px;
            background-color: red;
            color: white;
            font-size: large;
             border-radius: 20px;
        }
        .child2{
            width: 40%;           
            padding: 10px;
            background-color: black;
            margin-top: 5px;
            margin-left: 30px;
            margin-right: 30px;
            border-radius: 20px;
            border: 4px solid blue;
        }
        .child2 img{
            width: 70%;
            height: 50%;
        }
        .child2 .image,.btn{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .child2 h1{
            text-align: center;
            color: white;
            margin: 10PX;
        }
        .child2 .btn button{
            padding: 10px;
            width: 50%;
            margin: 20px;
            background-color: red;
            color: white;
            font-size: large;
            border-radius: 20px;
        }
        .child1:hover,.child2:hover{
            background-color: rgb(29, 29, 31);
        }
        .btn button:hover{
            background-color: blue;
        }
        li a{
            text-decoration: none;
            color: rgb(244, 244, 5);
        
        }
        li{
            border-right: 2px white solid;
            padding: 5px;
        }
        li a:hover{
            color: red;
            text-decoration: underline;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <div class="con">
        <div class="item1">
            <ol>
                <li><a href="">Home</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/sign">Signup</a></li>
                <li style="border: none;"><a href="">Admin_sign</a></li>
            </ol>
            <h1>WELCOME TO DASHBOARD</h1>
            

        </div>
        <div class="item2">
            <div class="child1">
                <h1>STUDENT PORTAL</h1>
                <div class="image">
                    <img src="static/student.webp" title="STUDENT POTAL" alt="">
                </div>
                <form action="/login/" class="btn">
                    <button type="submit">STUDENT LOGIN</button>
                </form>

            </div>
            <div class="child2">
                <h1>TEACHER PORTAL</h1>
                <div class="image">
                    <img src="static/teacher.webp" title="TEACHER POTAL" alt="">
                </div>
                <form action="" class="btn">
                    <button type="submit">TEACHER LOGIN</button>
                </form>
            </div>
        </div>
    </div>    
</body>
</html>
